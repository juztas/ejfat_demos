#
# EJFAT Sender Configuration
#
# Usage: ./start_sender.sh sender_config.yaml
#

# Path to file containing the EJFAT instance URI
instance_uri_file: INSTANCE_URI

# IP version: 4 or 6
ip_version: 4

# Transmission rate (Gbps)
tx_rate: 10

# Transmission length (bytes)
tx_length: 2097152

# Number of frames to send
nframes: 10000

# Number of send sockets
send_sockets: 8

# Data ID (leave empty for random)
# data_id:
