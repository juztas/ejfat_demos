#
# EJFAT Sender Configuration
#
# This file configures the EJFAT sender parameters.
# Copy this file to sender_config.yaml and customize as needed.
#
# Usage: ./start_sender.sh sender_config.yaml
#

# ============================================================================
# INSTANCE URI CONFIGURATION
# ============================================================================

# Path to file containing the EJFAT instance URI
# Default: INSTANCE_URI
instance_uri_file: INSTANCE_URI

# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================

# IP version to use: 4 or 6
# Default: 6
ip_version: 6

# ============================================================================
# SENDER CONFIGURATION
# ============================================================================

# Transmission rate in Gbps
# Supports instance-specific values: tx_rate_0, tx_rate_1, etc.
# Default: 0.1
#
# INSTANCE-SPECIFIC CONFIGURATION EXAMPLES:
#
# Example 1: All instances use same rate
#   tx_rate: 25
#   Result: tx_0, tx_1, tx_2... all send at 25 Gbps
#
# Example 2: Different rates per instance (load distribution)
#   tx_rate: 25         # Default for all instances
#   tx_rate_0: 10       # Instance 0: 10 Gbps
#   tx_rate_1: 30       # Instance 1: 30 Gbps
#   tx_rate_2: 40       # Instance 2: 40 Gbps
#   Result: tx_0=10 Gbps, tx_1=30 Gbps, tx_2=40 Gbps, tx_3+=25 Gbps
#
# Example 3: Gradual ramp-up for testing
#   tx_rate: 10         # Default
#   tx_rate_0: 5        # Start slow
#   tx_rate_1: 15       # Medium
#   tx_rate_2: 25       # Faster
#
tx_rate: 30

# Transmission length (packet size in bytes)
# Supports instance-specific values: tx_length_0, tx_length_1, etc.
# Default: 2097152 (2 MB)
#
# Example: Different frame sizes per instance
#   tx_length: 2097152      # Default: 2 MB frames
#   tx_length_0: 1048576    # Instance 0: 1 MB frames
#   tx_length_1: 4194304    # Instance 1: 4 MB frames
#
tx_length: 2097152

# Number of frames to send
# Supports instance-specific values: nframes_0, nframes_1, etc.
# Default: 10000
#
# Example: Different frame counts per instance (variable duration tests)
#   nframes: 100000         # Default: 100k frames
#   nframes_0: 50000        # Instance 0: shorter test
#   nframes_1: 200000       # Instance 1: longer test
#   Result: Each instance runs for different duration
#

nframes: 100000

# Number of send sockets to use
# Default: 8
send_sockets: 8

# Number of CPU cores to use for sender threads
# Can be a single number or a space-separated list of core IDs
# Default: 1
#
# CONFIGURATION PRIORITY (first match wins):
#   1. tx_cores_<hostname>_<ordinal>  # Most specific: hostname AND ordinal position
#   2. tx_cores_<hostname>            # Hostname-based: all instances on this host
#   3. tx_cores_<index>               # Instance-based: this TX_INDEX on any host
#   4. tx_cores                       # Global default: all instances, all hosts
#
# HOSTNAME+ORDINAL CONFIGURATION (MOST SPECIFIC - RECOMMENDED):
# Define different CPU cores for each sender on each DTN node using ordinal position.
# The _N suffix is the ORDINAL POSITION (0, 1, 2, ...) of the sender on that DTN,
# NOT the TX_INDEX. This means:
#   - First sender on wash-dtn1 uses tx_cores_wash-dtn1_0 (regardless of TX_INDEX)
#   - Second sender on wash-dtn1 uses tx_cores_wash-dtn1_1 (regardless of TX_INDEX)
#   - Third sender on wash-dtn1 uses tx_cores_wash-dtn1_2 (regardless of TX_INDEX)
#
# Example: Run tx_2, tx_5, tx_8 on wash-dtn1
#   tx_cores_wash-dtn1_0:  0  1  2  3  4  5  6  7    # tx_2 (1st on wash-dtn1)
#   tx_cores_wash-dtn1_1:  8  9 10 11 12 13 14 15    # tx_5 (2nd on wash-dtn1)
#   tx_cores_wash-dtn1_2: 16 17 18 19 20 21 22 23    # tx_8 (3rd on wash-dtn1)
#
# Example: Run tx_0, tx_1, tx_2 on star-dtn1
#   tx_cores_star-dtn1_0:  0  1  2  3  4  5  6  7    # tx_0 (1st on star-dtn1)
#   tx_cores_star-dtn1_1:  8  9 10 11 12 13 14 15    # tx_1 (2nd on star-dtn1)
#   tx_cores_star-dtn1_2: 16 17 18 19 20 21 22 23    # tx_2 (3rd on star-dtn1)
#
# HOSTNAME-BASED CONFIGURATION:
# Define CPU cores by DTN hostname - same cores for all instances on that host.
#
# Example: All sender instances on a DTN use the same cores
#   tx_cores_wash-dtn1: 0 1 2 3 4 5 6 7         # All senders on wash-dtn1
#   tx_cores_star-dtn1: 8 9 10 11 12 13 14 15   # All senders on star-dtn1
#
# INSTANCE-BASED CONFIGURATION (FALLBACK):
# Define cores by TX_INDEX - same across all DTN nodes.
#
# Example: All DTNs use the same core pattern per TX_INDEX
#   tx_cores_0: 0 1 2 3           # TX_INDEX=0 on any DTN
#   tx_cores_1: 8 9 10 11         # TX_INDEX=1 on any DTN
#

# Hostname+Instance CPU core assignments (most specific - customize for your setup)
#

# INTEL.  48 cores.  Maybe 24 active ? without hyperthreading
# NUMA 0 for NIC affinity

tx_cores_wash-dtn1_0:  0  1  2  3  4  5  6  7
tx_cores_wash-dtn1_1:  8  9 10 11 12 13 14 15
tx_cores_wash-dtn1_2: 16 17 18 19 20 21 22 23
tx_cores_wash-dtn1_3:  0  1  2  3  4  5  6  7
tx_cores_wash-dtn1_4:  8  9 10 11 12 13 14 15
tx_cores_wash-dtn1_5: 16 17 18 19 20 21 22 23

tx_cores_star-dtn1_0:  0  1  2  3  4  5  6  7
tx_cores_star-dtn1_1:  8  9 10 11 12 13 14 15
tx_cores_star-dtn1_2: 16 17 18 19 20 21 22 23
tx_cores_star-dtn1_3:  0  1  2  3  4  5  6  7
tx_cores_star-dtn1_4:  8  9 10 11 12 13 14 15
tx_cores_star-dtn1_5: 16 17 18 19 20 21 22 23


# AMD.  32 cores.
# NUMA 1 for NIC affinity

tx_cores_cern773-dtn1_0: 16 17 18 19 20 21 22 23
tx_cores_cern773-dtn1_1: 24 25 26 27 28 29 30 31
tx_cores_cern773-dtn1_2:  0  1  2  3  4  5  6  7  # compromise choice.
tx_cores_cern773-dtn1_3:  8  9 10 11 12 13 14 15

tx_cores_hous-dtn1_0: 16 17 18 19 20 21 22 23
tx_cores_hous-dtn1_1: 24 25 26 27 28 29 30 31
tx_cores_hous-dtn1_2:  0  1  2  3  4  5  6  7  # compromise choice.
tx_cores_hous-dtn1_3:  8  9 10 11 12 13 14 15

tx_cores_sunn-dtn1_0: 16 17 18 19 20 21 22 23
tx_cores_sunn-dtn1_1: 24 25 26 27 28 29 30 31
tx_cores_sunn-dtn1_2:  0  1  2  3  4  5  6  7  # compromise choice.
tx_cores_sunn-dtn1_3:  8  9 10 11 12 13 14 15

# AMD.  32 cores.
# Oddball : NUMA 7 for NIC affinity only 4 cores.

tx_cores_denv-dtn1_0: 24 25 26 27 28 29 30 31  # only half good.
tx_cores_denv-dtn1_1: 16 17 18 19 20 21 22 23
tx_cores_denv-dtn1_2:  0  1  2  3  4  5  6  7  # compromise choice.
tx_cores_denv-dtn1_3:  8  9 10 11 12 13 14 15



# Hostname-based CPU core assignments (all instances use same cores)
# tx_cores_cern773-dtn1: 0 1 2 3 4 5 6 7
# tx_cores_denv-dtn1: 8 9 10 11 12 13 14 15
# tx_cores_hous-dtn1: 16 17 18 19 20 21 22 23
# tx_cores_sunn-dtn1: 24 25 26 27 28 29 30 31

# Instance-based CPU core assignments (fallback - any DTN)
tx_cores_0: 0 1 2 3
tx_cores_1: 4 5 6 7
tx_cores_2: 8 9 10 11

# Global default
tx_cores: 0 1 2 3 4 5 6 7

# Data ID (identifier for the data stream)
# Default: random number between 1-1000
# Leave empty to use random value, or specify a specific number
# data_id: 123

# ============================================================================
# SEGMENTER CONFIGURATION
# ============================================================================

# Control Plane Settings
# ----------------------

# Enable control plane to send Sync packets
# Default: true
use_cp: true

# Warm up period between sync thread starting and data allowed to be sent (milliseconds)
# Default: 1000
warmup_ms: 1000

# Sync thread period in milliseconds
# Default: 1000
sync_period_ms: 1000

# Number of sync periods to use for averaging reported send rate
# Default: 2
sync_periods: 2

# Data Plane Settings
# -------------------

# Prefer V6 dataplane if the URI specifies both data=<ipv4>&data=<ipv6> addresses
# If not specified, automatically set to true when ip_version is 6, false when ip_version is 4
# Uncomment to override automatic behavior:
# dpv6: false

# Use connected sockets
# Default: true
connected_socket: true

# MTU size to fit segmented data (must accommodate IP, UDP, and LBRE headers)
# Value of 0 means auto-detect based on MTU of outgoing interface (Linux only)
# Default: 0
mtu: 8000

# Socket buffer size for sending (set via SO_SNDBUF setsockopt)
# Note: This requires systemwide max set via sysctl (net.core.wmem_max) to be higher
# Default: 3145728 (3 MB)
snd_socket_bufsize: 3145728

# Smooth out the rate per-frame rather than per event (for low rate values)
# Default: false
smooth: false

# Use consecutive destination ports starting from EjfatURI data port
# rather than a single port; source ports are still randomized
# (incompatible with a load balancer, only useful in back-to-back testing)
# Default: false
multi_port: false

# ============================================================================
# FILE TRANSFER CONFIGURATION
# ============================================================================

# File extension for file transfer
# Default: root
ft_extension: root

# File prefix for file transfer
# Default: test
ft_prefix: test

# File transfer rate in Gbps
# Default: 1
ft_rate: 1

# Number of sockets for file transfer
# Default: 4
ft_sockets: 4

# File transfer timeout (in milliseconds)
# Default: 7000
ft_timeout: 7000

# Number of threads for file transfer
# Default: 4
ft_threads: 4

# Number of test files to generate
# Default: 25
ft_numfiles: 25

# Test file size in MB
# Default: 300
ft_filesize: 300

# Data directory path
# Default: /data
data_path: /data
