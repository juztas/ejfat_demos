#
# EJFAT Receiver Configuration
#
# This file configures the EJFAT receiver parameters.
# Copy this file to receiver_config.yaml and customize as needed.
#
# Usage: ./start_receiver.sh receiver_config.yaml
#

# ============================================================================
# INSTANCE URI CONFIGURATION
# ============================================================================

# Path to file containing the EJFAT instance URI
# Default: INSTANCE_URI
instance_uri_file: INSTANCE_URI

# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================

# IP version to use: 4 or 6
# Default: 6
ip_version: 6

# Network interface to use (leave empty for auto-detection)
# Default: auto-detected based on route to load balancer
# interface: eth0

# ============================================================================
# RECEIVER CONFIGURATION
# ============================================================================

# Duration to receive data (in seconds)
# Default: 120
rx_duration: 30

# Number of receiver threads
# Default: 16
rx_threads: 16

# Receive buffer size (in bytes)
# Default: 400000000 (400 MB)
rx_bufsize: 400000000

# Receive timeout (in milliseconds)
# Default: 7000
rx_timeout: 7000

# Number of CPU cores to use
# Default: 1
rx_cores: 1

# Dequeue parameter
# Default: 16
rx_dequeue: 16

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

# Directory for log files
# Default: ./
log_dir: ./

# ============================================================================
# MONITORING CONFIGURATION
# ============================================================================

# Port range to monitor (format: start-end)
# Default: 10000-10015
monitor_ports: 50016-50032

# Monitoring interval (in seconds)
# Default: 0.1
monitor_interval: 0.1

# ============================================================================
# REASSEMBLER CONFIGURATION (reassembler_config.ini settings)
# ============================================================================
# These settings control the behavior of the reassembler INI file.
# All settings are optional and will use defaults if not specified.

# --- Control Plane Settings ---

# Whether to use the control plane (gRPC sendState, registerWorker)
# Default: true
# reassem_use_cp: true

# Validate control plane TLS certificate in gRPC communications
# Default: true
# reassem_validate_cert: true

# Force using address (v4 or v6) even if hostname specified in the URI
# Default: false
reassem_use_host_address: true

# --- Data Plane Settings ---

# Starting port for receiving data
# Default: 10000
reassem_data_port: 50016

# Port range: 2^portRange listening ports will be open starting from dataPort
# Values: 0-14 (power of 2), or -1 to match number of CPU cores/threads
# Default: -1
# reassem_port_range: -1

# Expect LB header to be included (mainly for testing when useCP==false)
# Default: false
# reassem_with_lb_header: false

# Event timeout: How long (in ms) events can remain in assembly before giving up
# Default: 500
# reassem_event_timeout_ms: 500

# Socket buffer size for receiving (SO_RCVBUF). Requires net.core.rmem_max to be higher.
# Default: 3145728 (3 MB)
# reassem_rcv_socket_bufsize: 3145728

# Period of one epoch in milliseconds
# Default: 1000
# reassem_epoch_ms: 1000

# Period of the send state thread in milliseconds
# Default: 100
# reassem_period_ms: 100

# --- PID Controller Settings ---

# SetPoint: Queue occupied percentage to drive the PID controller to
# Default: 0.0
# reassem_pid_setpoint: 0.0

# PID Gains: Integral gain
# Default: 0.0
# reassem_pid_ki: 0.0

# PID Gains: Proportional gain
# Default: 0.0
# reassem_pid_kp: 0.0

# PID Gains: Derivative gain
# Default: 0.0
# reassem_pid_kd: 0.0

# Schedule weight parameter
# Default: 1.0
# reassem_pid_weight: 1.0

# Minimum factor: Multiplied with even slot allocation to determine min slots
# Example: 4 nodes with minFactor 0.5 = (512 slots / 4) * 0.5 = min 64 slots
# Default: 0.5
# reassem_pid_min_factor: 0.5

# Maximum factor: Multiplied with even slot allocation to determine max slots
# Example: 4 nodes with maxFactor 2.0 = (512 slots / 4) * 2.0 = max 256 slots
# Default: 2.0
# reassem_pid_max_factor: 2.0
