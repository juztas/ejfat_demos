#
# EJFAT Receiver Configuration
#
# This file configures the EJFAT receiver parameters.
# Copy this file to receiver_config.yaml and customize as needed.
#
# Usage: ./start_receiver.sh receiver_config.yaml
#

# ============================================================================
# INSTANCE URI CONFIGURATION
# ============================================================================

# Path to file containing the EJFAT instance URI
# Default: INSTANCE_URI
instance_uri_file: INSTANCE_URI

# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================

# IP version to use: 4 or 6
# Default: 6
ip_version: 6

# Network interface to use (leave empty for auto-detection)
# Default: auto-detected based on route to load balancer
# interface: eth0

# ============================================================================
# RECEIVER CONFIGURATION
# ============================================================================

# Duration to receive data (in seconds)
# Default: 120
#
# RECEIVER DURATION OPTIONS:
#   rx_duration: -1     # Auto-calculate from sender_config.yaml (if found, else default 120s)
#   rx_duration: 0      # Run for 0 seconds (immediate shutdown - useful for testing)
#   rx_duration: 360    # Fixed 360 second (6 minute) receiver duration
#   rx_duration: 7200   # Fixed 2 hour receiver duration for long tests
#
# AUTO-CALCULATION FEATURE (rx_duration: -1):
# When set to -1, the receive script will:
#   1. Look for sender_config.yaml in the same directory as receiver_config.yaml
#   2. Analyze ALL sender instances (tx_0, tx_1, tx_2, etc.) considering instance-specific overrides
#   3. Calculate duration for each sender: (nframes × tx_length × 8 bits) / (tx_rate × 10^9)
#   4. Find the longest sender duration across all instances
#   5. Add a 30-second buffer for sender completion and cleanup
#   6. Set receiver duration = longest_sender_duration + 30 seconds
#   7. Document the calculation in the generated reassembler INI file
#   8. If sender_config.yaml is not found or calculation fails, fall back to default 120s
#
# The auto-calculation ensures receivers run long enough to capture all data from the
# slowest sender, preventing premature receiver shutdown.
#
rx_duration: 120

# Number of receiver threads
# Default: 16
rx_threads: 16

# Receive buffer size (in bytes)
# Default: 400000000 (400 MB)
rx_bufsize: 400000000

# Receive timeout (in milliseconds)
# Default: 7000
rx_timeout: 7000

# Number of CPU cores to use
# Supports instance-specific values: rx_cores_0, rx_cores_1, etc.
# Falls back to rx_cores if instance-specific value not found
# Default: 1
#
# INSTANCE-SPECIFIC CONFIGURATION EXAMPLES:
#
# Example 1: All instances use same value
#   rx_cores: 8
#   Result: rx_0, rx_1, rx_2... all use 8 cores
#
# Example 2: Override specific instances
#   rx_cores: 8         # Default for all instances
#   rx_cores_0: 4       # Instance 0 uses 4 cores
#   rx_cores_1: 12      # Instance 1 uses 12 cores
#   Result: rx_0=4, rx_1=12, rx_2+=8 (default)
#
# Example 3: Pin to specific CPU cores
#   rx_cores: 0 1 2 3 4 5 6 7     # Default: cores 0-7
#   rx_cores_0: 8 9 10 11         # Instance 0: cores 8-11
#   rx_cores_1: 12 13 14 15       # Instance 1: cores 12-15
#
rx_cores: 8

# Dequeue parameter
# Supports instance-specific values: rx_dequeue_0, rx_dequeue_1, etc.
# Default: 16
#
# Example: Different dequeue values per instance
#   rx_dequeue: 16        # Default for all instances
#   rx_dequeue_0: 32      # Instance 0 uses larger buffer
#   rx_dequeue_1: 8       # Instance 1 uses smaller buffer
#
rx_dequeue: 16

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

# Directory for log files
# Default: ./
log_dir: ./

# ============================================================================
# MONITORING CONFIGURATION
# ============================================================================

# Port range to monitor (format: start-end)
# Default: 10000-10015
monitor_ports: 10000-10007

# Monitoring interval (in seconds)
# Default: 0.1
monitor_interval: 10

# Stats reporting period for e2sar_perf (in milliseconds)
# Controls how often receiver stats are printed to the console
# Default: 1000   Max 65535
stats_period_ms: 60000

# ============================================================================
# REASSEMBLER CONFIGURATION (reassembler_config.ini settings)
# ============================================================================
# These settings control the behavior of the reassembler INI file.
# All settings are optional and will use defaults if not specified.

# --- Control Plane Settings ---

# Whether to use the control plane (gRPC sendState, registerWorker)
# Default: true
# reassem_use_cp: true

# Validate control plane TLS certificate in gRPC communications
# Default: true
# reassem_validate_cert: true

# Force using address (v4 or v6) even if hostname specified in the URI
# Default: false
reassem_use_host_address: true

# --- Data Plane Settings ---

# Starting port for receiving data
# Default: 10000
reassem_data_port: 10000

# Port range: 2^portRange listening ports will be open starting from dataPort
# Supports instance-specific values: reassembler_port_range_0, reassembler_port_range_1, etc.
# Values: 0-14 (power of 2), or -1 to match number of CPU cores/threads
# Default: -1
#
# Example 1: All instances auto-match cores
#   reassembler_port_range: -1
#   Result: Each instance opens 2^(cores) ports
#
# Example 2: Different port ranges per instance
#   reassembler_port_range: -1     # Default: auto-match cores
#   reassembler_port_range_0: 4    # Instance 0: 2^4 = 16 ports
#   reassembler_port_range_1: 6    # Instance 1: 2^6 = 64 ports
#
# Example 3: Fixed port count for testing
#   reassembler_port_range: 3      # All instances use 2^3 = 8 ports
#
# reassembler_port_range: -1

# Expect LB header to be included (mainly for testing when useCP==false)
# Default: false
# reassem_with_lb_header: false

# Event timeout: How long (in ms) events can remain in assembly before giving up
# Default: 500
# reassem_event_timeout_ms: 500

# Socket buffer size for receiving (SO_RCVBUF). Requires net.core.rmem_max to be higher.
# Default: 3145728 (3 MB)
# reassem_rcv_socket_bufsize: 3145728

# Period of one epoch in milliseconds
# Default: 1000
# reassem_epoch_ms: 1000

# Period of the send state thread in milliseconds
# Default: 100
# reassem_period_ms: 100

# --- PID Controller Settings ---

# SetPoint: Queue occupied percentage to drive the PID controller to
# Default: 0.0
# reassem_pid_setpoint: 0.0

# PID Gains: Integral gain
# Default: 0.0
# reassem_pid_ki: 0.0

# PID Gains: Proportional gain
# Default: 0.0
# reassem_pid_kp: 0.0

# PID Gains: Derivative gain
# Default: 0.0
# reassem_pid_kd: 0.0

# Schedule weight parameter
# Default: 1.0
# reassem_pid_weight: 1.0

# Minimum factor: Multiplied with even slot allocation to determine min slots
# Example: 4 nodes with minFactor 0.5 = (512 slots / 4) * 0.5 = min 64 slots
# Default: 0.5
# reassem_pid_min_factor: 0.5

# Maximum factor: Multiplied with even slot allocation to determine max slots
# Example: 4 nodes with maxFactor 2.0 = (512 slots / 4) * 2.0 = max 256 slots
# Default: 2.0
# reassem_pid_max_factor: 2.0
