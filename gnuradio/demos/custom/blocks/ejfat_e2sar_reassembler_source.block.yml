id: ejfat_e2sar_reassembler_source
label: E2SAR Reassembler Source
category: '[EJFAT]'

templates:
  imports: from gnuradio import ejfat
  make: |
    ejfat.e2sar_reassembler_source(
        uri=${uri},
        data_ip=${data_ip},
        starting_port=${starting_port},
        vector_size=${vector_size},
        num_recv_threads=${num_recv_threads},
        use_cp=${use_cp},
        use_host_address=${use_host_address},
        period_ms=${period_ms},
        validate_cert=${validate_cert},
        with_lb_header=${with_lb_header},
        event_timeout_ms=${event_timeout_ms},
        rcv_socket_buf_size=${rcv_socket_buf_size},
        port_range=${port_range},
        epoch_ms=${epoch_ms},
        ki=${ki},
        kp=${kp},
        kd=${kd},
        set_point=${set_point},
        weight=${weight},
        min_factor=${min_factor},
        max_factor=${max_factor}
    )

parameters:
# Core Parameters
- id: uri
  label: EJFAT URI
  dtype: string
  default: 'ejfat://useless@192.168.100.1:9876/lb/1?sync=192.168.0.1:12345&data=127.0.0.1'
  category: Core

- id: data_ip
  label: Data IP Address
  dtype: string
  default: '127.0.0.1'
  category: Core

- id: starting_port
  label: Starting Port
  dtype: int
  default: '19522'
  category: Core

- id: vector_size
  label: Vector Size
  dtype: int
  default: '1024'
  category: Core

- id: num_recv_threads
  label: Number of Receiver Threads
  dtype: int
  default: '1'
  category: Core

# Control Plane Parameters
- id: use_cp
  label: Use Control Plane
  dtype: bool
  default: 'False'
  category: Control Plane

- id: use_host_address
  label: Use Host Address for gRPC
  dtype: bool
  default: 'False'
  category: Control Plane
  hide: ${ 'part' if use_cp else 'all' }

- id: period_ms
  label: SendState Period (ms)
  dtype: int
  default: '100'
  category: Control Plane
  hide: ${ 'part' if use_cp else 'all' }

- id: validate_cert
  label: Validate TLS Certificate
  dtype: bool
  default: 'True'
  category: Control Plane
  hide: ${ 'part' if use_cp else 'all' }

# Network Parameters
- id: with_lb_header
  label: With Load Balancer Header
  dtype: bool
  default: 'True'
  category: Network

- id: event_timeout_ms
  label: Event Timeout (ms)
  dtype: int
  default: '5000'
  category: Network

- id: rcv_socket_buf_size
  label: Socket Buffer Size (bytes)
  dtype: int
  default: '3145728'
  category: Network

- id: port_range
  label: Port Range (2^N ports, -1=auto)
  dtype: int
  default: '-1'
  category: Network

# PID Control Parameters
- id: epoch_ms
  label: PID Epoch Period (ms)
  dtype: int
  default: '1000'
  category: PID Control
  hide: ${ 'part' if use_cp else 'all' }

- id: ki
  label: PID Integral Gain (Ki)
  dtype: float
  default: '0.0'
  category: PID Control
  hide: ${ 'part' if use_cp else 'all' }

- id: kp
  label: PID Proportional Gain (Kp)
  dtype: float
  default: '0.0'
  category: PID Control
  hide: ${ 'part' if use_cp else 'all' }

- id: kd
  label: PID Derivative Gain (Kd)
  dtype: float
  default: '0.0'
  category: PID Control
  hide: ${ 'part' if use_cp else 'all' }

- id: set_point
  label: PID Setpoint (queue %)
  dtype: float
  default: '0.0'
  category: PID Control
  hide: ${ 'part' if use_cp else 'all' }

# Load Balancing Parameters
- id: weight
  label: Node Weight
  dtype: float
  default: '1.0'
  category: Load Balancing
  hide: ${ 'part' if use_cp else 'all' }

- id: min_factor
  label: Min Slot Allocation Factor
  dtype: float
  default: '0.5'
  category: Load Balancing
  hide: ${ 'part' if use_cp else 'all' }

- id: max_factor
  label: Max Slot Allocation Factor
  dtype: float
  default: '2.0'
  category: Load Balancing
  hide: ${ 'part' if use_cp else 'all' }

outputs:
- label: out
  domain: stream
  dtype: complex
  vlen: ${vector_size}

documentation: |
  E2SAR Reassembler Source Block

  Receives complex sample vectors via the E2SAR Reassembler from the EJFAT data plane.

  Core Parameters:
  - EJFAT URI: Connection string for EJFAT load balancer
  - Data IP Address: Local IP address to listen on for data packets
  - Starting Port: First UDP port number for receiving data
  - Vector Size: Number of complex samples per output vector (1 for streaming)
  - Number of Receiver Threads: Parallel receiver threads for high throughput

  Control Plane Parameters:
  - Use Control Plane: Enable worker registration and state reporting
  - Use Host Address for gRPC: Use IP address instead of hostname for gRPC
  - SendState Period: How often to send state updates to control plane (ms)
  - Validate TLS Certificate: Validate control plane's TLS certificate

  Network Parameters:
  - With Load Balancer Header: Expect LB header in packets (True for testing)
  - Event Timeout: Time to wait for incomplete events before giving up (ms)
  - Socket Buffer Size: OS socket receive buffer size in bytes
  - Port Range: Number of listening ports as 2^N (-1 = auto-detect based on threads)

  PID Control Parameters (for dynamic load balancing):
  - PID Epoch Period: PID controller update period (ms)
  - PID Integral Gain (Ki): Integral component gain
  - PID Proportional Gain (Kp): Proportional component gain
  - PID Derivative Gain (Kd): Derivative component gain
  - PID Setpoint: Target queue occupancy percentage

  Load Balancing Parameters:
  - Node Weight: Relative processing power of this worker (1.0 = normal)
  - Min Slot Allocation Factor: Minimum slot allocation multiplier
  - Max Slot Allocation Factor: Maximum slot allocation multiplier

  For more information, see the E2SAR Reassembler API documentation.

file_format: 1
