# Jupyter Book Configuration
# Learn more at https://jupyterbook.org/customize/config.html

title: "Running Experiments with Bluesky"
author: "EJFAT Team"
copyright: "2025"
logo: ""

# Force re-execution of notebooks on each build
execute:
  execute_notebooks: cache
  timeout: 300
  allow_errors: false

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: bluesky_tutorial.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/JeffersonLab/E2SAR
  path_to_book: ejfat_demos/gnuradio/demos/full_system/jupyter_book_tutorial
  branch: main

# Add GitHub buttons to your book
html:
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: false
  home_page_in_navbar: true
  baseurl: ""

# Launch buttons
launch_buttons:
  notebook_interface: "jupyterlab"
  binderhub_url: ""

# Sphinx configuration
sphinx:
  extra_extensions:
    - sphinx_copybutton
    - sphinx_togglebutton
  config:
    html_theme_options:
      repository_url: https://github.com/JeffersonLab/E2SAR
      use_repository_button: true
      navigation_depth: 3
