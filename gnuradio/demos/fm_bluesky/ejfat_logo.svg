<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <!-- EJFAT Logo -->

  <!-- Background pattern elements (light blue hexagons/network pattern) -->
  <defs>
    <pattern id="bgPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#B8D8E8" opacity="0.3"/>
      <circle cx="30" cy="20" r="1" fill="#B8D8E8" opacity="0.3"/>
      <line x1="10" y1="10" x2="30" y2="20" stroke="#B8D8E8" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="120" fill="white"/>
  <rect width="400" height="120" fill="url(#bgPattern)"/>

  <!-- EJFAT text (large teal letters) -->
  <text x="20" y="65" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#2C7A9B">EJFAT</text>

  <!-- Subtitle -->
  <text x="20" y="95" font-family="Arial, sans-serif" font-size="11" fill="#4A4A4A">ESnet-Jefferson Lab FPGA Accelerated Transport</text>

  <!-- Decorative lines on the left -->
  <line x1="5" y1="35" x2="15" y2="35" stroke="#2C7A9B" stroke-width="1.5"/>
  <line x1="5" y1="42" x2="12" y2="42" stroke="#2C7A9B" stroke-width="1.5"/>
  <line x1="5" y1="49" x2="10" y2="49" stroke="#2C7A9B" stroke-width="1.5"/>
</svg>
