[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ejfat_shm"
version = "0.1.0"
description = "High-performance FIFO queue using POSIX shared memory"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "EJFAT Project"}
]
keywords = ["shared-memory", "fifo", "ipc", "posix", "queue"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
dependencies = [
    "posix_ipc>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/ejfat/ejfat_shm"
Repository = "https://github.com/ejfat/ejfat_shm"
Issues = "https://github.com/ejfat/ejfat_shm/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ejfat_shm*"]
exclude = ["tests*", "examples*"]
