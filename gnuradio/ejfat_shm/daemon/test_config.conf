# Test Configuration for EJFAT SHM Daemon
# This is a minimal config for testing with local setup

[SHM FIFO]
fifo_name = test_fifo
read_timeout = 5.0

[EJFAT]
# Test URI - replace with your actual setup
ejfat_uri = ejfat://useless@192.168.100.1:18347/lb/1?sync=192.168.254.1:12345&data=10.250.100.123:19522
data_id = 0x0001
event_src_id = 0x12345678

[Network]
use_ipv6 = false
use_control_plane = false  # Set to false for testing without UDPLBd
mtu = 1500
warmup_ms = 1000
sync_period_ms = 1000
sync_periods = 2

[Performance]
num_send_sockets = 2  # Lower for testing
send_socket_buffer_size = 1048576  # 1MB
rate_gbps = -1.0
smooth_rate = false
multi_port = false

[System]
cpu_core = -1
foreground = true  # Run in foreground for testing
log_level = 3  # Debug level

[Statistics]
stats_interval = 10  # Report stats every 10 seconds
